    <h1>Nueva ley de educación aprobada por el Congreso</h1>
    <p class="lead">El Congreso de la República aprobó la nueva ley de educación que establece la gratuidad en universidades públicas.</p>
    <p>La medida beneficiará a estudiantes de estratos uno y dos en todo el país, con un presupuesto inicial de 3 billones de pesos.</p>
